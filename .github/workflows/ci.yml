name: Frontend CI/CD — Test, Scan, Docker Hub Publish & AWS OIDC Deploy

on:
  push:
    branches: [main, "feat/**", "release/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'akintoyesodeinde' }}
  IMAGE_NAME: akademia-ai-frontend

jobs:
  build-and-test:
    name: 1. OpenAPI Sync, Typecheck, Unit Tests & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Check OpenAPI TypeScript contract synchronization
        run: npm run generate:api

      - name: Run TypeScript strict type checking
        run: npm run typecheck

      - name: Run unit, component, and accessibility tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  build-scan-and-publish:
    name: 2. Build, Vulnerability Scan & Publish Docker Image
    needs: [build-and-test]
    runs-on: ubuntu-latest
    outputs:
      image_repo: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
      image_tag: sha-${{ github.sha }}
      image_digest: ${{ steps.push.outputs.digest || steps.build-local.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image for vulnerability scanning
        id: build-local
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Authenticate to Docker Hub
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract immutable tags (commit SHA + optional semver tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}

      - name: Push immutable image to Docker Hub
        id: push
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Record immutable image digest in workflow summary
        run: |
          DIGEST="${{ steps.push.outputs.digest || steps.build-local.outputs.digest }}"
          echo "### Frontend Container Image Artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repository**: \`${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit SHA Tag**: \`sha-${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Immutable Digest**: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-aws-ec2:
    name: 3. Deploy to AWS EC2 via OIDC & SSM Run Command
    needs: [build-scan-and-publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assume AWS Deployment IAM Role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: akademia-frontend-deploy-${{ github.run_id }}

      - name: Update SSM Parameter and Trigger Controlled SSM Deployment with Rollback
        env:
          IMAGE_REF: "${{ needs.build-scan-and-publish.outputs.image_repo }}@${{ needs.build-scan-and-publish.outputs.image_digest }}"
        run: |
          chmod +x scripts/ssm-deploy-frontend.sh
          ./scripts/ssm-deploy-frontend.sh "$IMAGE_REF"
